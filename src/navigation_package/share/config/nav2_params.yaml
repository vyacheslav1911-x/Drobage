global_costmap:
  global_costmap:
    ros__parameters:
#
      transform_tolerance: 0.2
      update_frequency: 1.0
      publish_frequency: 1.0
#
      global_frame: map
      robot_base_frame: base_link

      always_send_full_costmap: True

#      unknown_cost_value: -1
      track_unknown_space: false
      rolling_window: false
      map_topic: /map
      data_type: OccupancyGrid
      map_subscribe_transient_local: True
      footprint: "[[0.115, 0.075],[0.115, -0.075],[-0.115, -0.075],[-0.115, 0.075]]"

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        enabled: True
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: rtab_obstacles
        rtab_obstacles:
          topic: /scan
          queue_size: 10.0
          clearing: True
          marking: True
          data_type: LaserScan
          sensor_frame: base_laser
          min_obstacle_height: 0.15
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
      inflation_layer:
        enabled: True
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.12
        

local_costmap:
  local_costmap:
    ros__parameters:
      transform_tolerance: 0.2
      global_frame: odom
      robot_base_frame: base_link
      map_topic: /map
      map_subscribe_transient_local: True
#      unknown_cost_value: -1
      track_unknown_space: false
      update_frequency: 5.0
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.02
      always_send_full_costmap: True
      footprint: "[[0.115, 0.075],[0.115, -0.075],[-0.115, -0.075],[-0.115, 0.075]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: rtab_obstacles
        rtab_obstacles:
          topic: /scan
          data_type: LaserScan
          sensor_frame: base_laser
          queue_size: 10.0
          clearing: True
          marking: True
          min_obstacle_height: 0.15
          max_obstacle_height: 2.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
      inflation_layer:
        enabled: True
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.12
        cost_scaling_factor: 3.0




